# ── Finance (Django) ──────────────────────────────────────────────────────────
server {
    listen 80;
    server_name finance.tudominio.com;   # cambia por tu IP o dominio

    # Archivos estáticos servidos directamente por Nginx (sin tocar Gunicorn)
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass         http://finance:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ── Ollama API ────────────────────────────────────────────────────────────────
# El contenedor de Ollama está en la red "shared_net" con nombre "ollama"
server {
    listen 80;
    server_name ollama.tudominio.com;    # cambia por tu IP o dominio

    location / {
        proxy_pass         http://ollama:11434;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_buffering    off;            # necesario para streaming de tokens
        proxy_read_timeout 300s;
    }
}
