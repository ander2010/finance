version: "3.9"

# Corre junto al docker-compose.yml de Ollama usando una red compartida.
# Asegúrate de que la red "shared_net" exista:
#   docker network create shared_net
#
# Luego en el docker-compose.yml de Ollama agrega:
#   networks:
#     default:
#       name: shared_net
#       external: true

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  # ── Django (Finance) ──────────────────────────────────────────────────────────
  finance:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://finance:${DB_PASSWORD}@db:5432/finance
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    depends_on:
      - db
    volumes:
      - staticfiles:/app/staticfiles
    networks:
      - internal
      - shared_net

  # ── Nginx (reverse proxy) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
    depends_on:
      - finance
    networks:
      - internal
      - shared_net

volumes:
  pgdata:
  staticfiles:

networks:
  internal:
  shared_net:
    external: true
